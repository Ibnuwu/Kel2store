<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kel2Store Admin — Dashboard</title>
  <meta name="description" content="Panel Admin Kel2Store untuk mengelola pesanan, produk, dan ringkasan penjualan toko.">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- ========== LOGIN MODAL ========== -->
  <div class="modal-overlay" id="login-overlay"></div>
  <div class="login-modal" id="login-modal" role="dialog" aria-modal="true">
    <div class="login-brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7"/></svg>
      <h1>Kel2Store Admin</h1>
      <p>Masuk untuk mengelola toko</p>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="admin@kel2store.com" required>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="btn btn-primary btn-full">Masuk</button>
    </form>
  </div>

  <!-- ========== ADMIN APP ========== -->
  <div id="admin-app">

    <!-- Topbar -->
    <header class="admin-topbar">
      <div class="topbar-left">
        <a href="admin.html" class="topbar-brand">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7"/></svg>
          Kel2Store
        </a>
      </div>
      <div class="topbar-right">
        <span class="topbar-date" id="current-date-text"></span>
        <span class="topbar-user" id="admin-user-email"></span>
        <a href="index.html" class="btn btn-ghost btn-sm">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Toko
        </a>
        <button class="btn btn-ghost btn-sm" id="btn-logout">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </header>

    <!-- Main Content — Single Page Layout -->
    <main class="admin-main">

      <!-- Stats Row -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon omset-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
          <div class="stat-content">
            <span class="stat-label">Total Omset</span>
            <span class="stat-value" id="stat-omset">Rp 0</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon pending-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div class="stat-content">
            <span class="stat-label">Pesanan Baru</span>
            <span class="stat-value" id="stat-pending">0</span>
          </div>
        </div>
      </div>

      <!-- Orders Section -->
      <div class="card">
        <div class="card-header">
          <h2>Daftar Pesanan</h2>
        </div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Pelanggan</th>
                <th>Item</th>
                <th>Total</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="orders-tbody">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Products Section -->
      <div class="card">
        <div class="card-header">
          <h2>Daftar Produk</h2>
          <button class="btn btn-primary btn-sm" id="btn-add-product">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            Tambah Produk
          </button>
        </div>
        <div id="products-list">
          <!-- Rendered by JS -->
        </div>
      </div>

    </main>
  </div>

  <!-- ========== PRODUCT FORM MODAL ========== -->
  <div class="modal-overlay" id="product-modal-overlay"></div>
  <div class="form-modal" id="product-modal" role="dialog" aria-modal="true">
    <div class="form-modal-header">
      <h2>Tambah Produk</h2>
      <button class="btn-close" id="product-modal-close" aria-label="Tutup">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <form id="product-form">
      <div class="form-group">
        <label for="prod-name">Nama Produk *</label>
        <input type="text" id="prod-name" placeholder="Contoh: Kopi Susu Gula Aren" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="prod-price">Harga (Rp) *</label>
          <input type="number" id="prod-price" min="0" step="100" placeholder="15000" required>
        </div>
        <div class="form-group">
          <label for="prod-stock">Stok *</label>
          <input type="number" id="prod-stock" min="0" value="100" required>
        </div>
      </div>
      <div class="form-group">
        <label for="prod-category">Kategori *</label>
        <select id="prod-category" required>
          <option value="Makanan">Makanan</option>
          <option value="Minuman">Minuman</option>
          <option value="Snack">Snack</option>
          <option value="Kebutuhan Harian">Kebutuhan Harian</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>
      <div class="form-group">
        <label for="prod-image">URL Gambar *</label>
        <input type="url" id="prod-image" placeholder="https://images.unsplash.com/..." required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Simpan Produk</button>
    </form>
  </div>

  <!-- ========== DELETE CONFIRMATION MODAL ========== -->
  <div class="modal-overlay" id="delete-overlay"></div>
  <div class="delete-modal" id="delete-modal" role="dialog" aria-modal="true">
    <div class="delete-icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
    </div>
    <h3 id="delete-modal-title">Hapus data ini?</h3>
    <p>Tindakan ini tidak dapat dibatalkan.</p>
    <div class="delete-actions">
      <button class="btn btn-ghost" id="btn-cancel-delete">Batal</button>
      <button class="btn btn-danger" id="btn-confirm-delete">Hapus</button>
    </div>
  </div>

  <!-- ========== TOAST ========== -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
